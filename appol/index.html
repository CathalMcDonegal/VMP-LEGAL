low:auto;padding:20px}.sheet-head{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-bottom:12px}.sheet-head h2{margin:0}.sheet-head span{color:var(--muted);font-size:12px}.group h3{color:var(--gold);margin:18px 0 5px}.row{border-bottom:1px solid var(--line);padding:14px 0}.row b{color:var(--gold)}.row h3{margin:5px 0}.row p{line-height:1.45}.row small,.source,.legal{color:var(--muted);font-size:13px;margin-top:7px}.fav{float:right;border:0;background:none;color:var(--gold);font-size:22px}.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.menu-btn{background:var(--card);border:1px solid var(--line);border-radius:16px;color:var(--text);padding:18px;text-align:left;display:grid;gap:5px;cursor:pointer;font-size:25px}.menu-btn strong{font-size:17px}.menu-btn small{font-size:12px;color:var(--muted)}.notice{padding:12px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:13px;margin-top:12px}.empty{color:var(--muted)}@media(max-width:520px){.grid{grid-template-columns:1fr}.card{min-height:auto}.menu-grid{grid-template-columns:1fr 1fr}}@media(max-width:360px){.menu-grid{grid-template-columns:1fr}}</style></head><body><header><h1>APPOL</h1><button class="back" id="install" hidden>Instal·la</button></header><main><section class="hero"><h2>Mobilitat i intervenció</h2><p>Consulta ràpida, clara i pensada per utilitzar-la al carrer.</p></section><section class="grid"><button class="card" data-module="mob"><b>🚦 Mobilitat</b><span>VMP, VTC, infraccions i documentació.</span></button><button class="card" data-module="int"><b>👮 Intervenció</b><span>Actuació, penal, procediment, circulació i ordenances.</span></button></section><section class="section"><h3>Cercador general</h3><div class="search"><input id="q" placeholder="Article, infracció, concepte…" autocomplete="off"><button id="go">Cercar</button></div></section><section class="section"><h3>Accés ràpid</h3><div class="tools"><button class="tool" data-module="fav">⭐
